{% extends "admin/base.html" %}
{% set page_title = "Solicitações - Admin" %}

{% block content %}
<div class="page-title-row">
    <div>
        <h1>Solicitações</h1>
        <p id="sol-count-label">Carregando…</p>
    </div>
    <button type="button" class="btn-export" id="btn-exportar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"></path></svg>
        Exportar Excel
    </button>
</div>

<div class="search-box-inline" style="position:relative;max-width:420px;">
    <input type="search" id="busca" placeholder="Solicitante, setor, equipamento, função…" aria-label="Pesquisar solicitações" style="padding-left:38px;">
    <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </span>
</div>

<div id="lista-solicitacoes" style="display:flex;flex-direction:column;gap:10px;margin-top:18px;">
    <p class="hint">Carregando...</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='admin_common.js') }}"></script>
<script src="{{ url_for('static', filename='admin_solicitacoes.js') }}"></script>
{% endblock %}

{% extends "admin/base.html" %}
{% set page_title = "Configuração - Admin" %}

{% block content %}
<div class="page-title-row">
    <div>
        <h1>Configuração</h1>
        <p>Opções que aparecem no formulário. Alterações refletem imediatamente.</p>
    </div>
</div>

<div class="config-layout">
    <div class="config-tab-list" id="config-tabs">
        <button type="button" class="config-tab active" data-grupo="equipamento">
            Equipamento <span class="config-tab-count" data-count-for="equipamento">–</span>
        </button>
        <button type="button" class="config-tab" data-grupo="setor_solicitante">
            Setor solicitante <span class="config-tab-count" data-count-for="setor_solicitante">–</span>
        </button>
        <button type="button" class="config-tab" data-grupo="as_code">
            AS — Área de serviço <span class="config-tab-count" data-count-for="as_code">–</span>
        </button>
    </div>

    <div class="config-panel">
        <div class="config-panel-head">
            <h2 id="titulo-grupo">Equipamento</h2>
            <form id="form-nova-opcao" class="config-add">
                <input name="valor" placeholder="Nova opção…" required aria-label="Nova opção">
                <button type="submit" class="btn-primary">Adicionar</button>
            </form>
        </div>
        <div id="lista-opcoes">
            <p class="hint" style="padding:16px 18px;margin:0;">Carregando...</p>
        </div>
        <p id="config-status" class="status-inline" hidden style="margin:0 18px 14px;"></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='config.js') }}"></script>
{% endblock %}

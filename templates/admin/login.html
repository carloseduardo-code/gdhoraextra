<!DOCTYPE html>
<html lang="pt-BR">
<head>
{% set page_title = "Login Admin" %}
{% include "_head.html" %}
</head>
<body>
<div class="container home-container">
    <div class="auth-shell">
        <div class="auth-inner">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Gonçalves &amp; Dias">
            <h1>Área administrativa</h1>
            <p>Entre com seu usuário e senha cadastrados.</p>

            {% if erro %}
            <p class="erro-box" style="margin-top:20px;">{{ erro }}</p>
            {% endif %}

            <form method="post" class="auth-card login-form">
                <div class="form-group" style="margin-bottom:0;">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="seu.usuario" required autofocus autocomplete="username">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p class="auth-back"><a href="{{ url_for('index') }}">← Voltar à área pública</a></p>
        </div>
    </div>
</div>
</body>
</html>

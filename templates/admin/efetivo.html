{% extends "admin/base.html" %}
{% set page_title = "Efetivo - Admin" %}

{% block content %}
<div class="page-title-row">
    <div>
        <h1>Efetivo</h1>
        <p id="total-registros">Carregando…</p>
    </div>
    <form id="form-importar" style="margin:0;">
        <input type="file" id="arquivo-input" accept=".xls,.xlsx,.csv" style="display:none;">
        <button type="button" class="btn-import" id="btn-importar-trigger">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 7l5-5 5 5M4 21h16"></path></svg>
            Importar planilha
        </button>
        <button type="submit" id="btn-importar" hidden>Importar</button>
    </form>
</div>

<div class="callout-warning">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
    <p>Ao importar, o efetivo anterior é removido e substituído pela nova planilha.</p>
</div>
<p id="status-import" class="status-inline" style="margin:-10px 0 14px;"></p>

<div class="table-card">
    <div style="padding:14px 16px;border-bottom:1px solid #EFF1F5;">
        <div style="position:relative;max-width:360px;">
            <input type="search" id="busca" placeholder="Pesquisar por matrícula ou nome…" aria-label="Pesquisar colaborador" style="padding-left:38px;min-height:40px;">
            <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            </span>
        </div>
    </div>
    <div class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Matrícula</th>
                    <th>Nome</th>
                    <th>Função</th>
                </tr>
            </thead>
            <tbody id="efetivo-body">
                <tr><td colspan="3">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='efetivo.js') }}"></script>
{% endblock %}
